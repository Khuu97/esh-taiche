<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESH Tái Chế – Hộp cũ, đủ điều hay</title>
<meta name="theme-color" content="#83184c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5; --card:#fff; --ink:#1c1e21; --muted:#65676b; --line:#e4e6eb; --hover:#f2f2f2; --field:#f0f2f5;
  --brand:#83184c; --brand-2:#a1245f; --brand-soft:#f7e8ef; --heart:#e0245e;
  --ok:#137a46; --okbg:#e3f4ea; --warn:#9a5b00; --warnbg:#fdf1d8; --bad:#b42318; --badbg:#fde7e5;
  --shadow:0 1px 2px rgba(0,0,0,.12);
  --shadow-lg:0 12px 28px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.08);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Thanh trên ===== */
.top{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1);height:56px}
.top .in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:56px;padding:0 16px;gap:8px}
.tl{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;flex:none}
.logo .mk{width:40px;height:40px;border-radius:50%;background:var(--brand);display:grid;place-items:center;overflow:hidden}
.logo .mk img{width:30px;height:auto;filter:brightness(0) invert(1)}
.logo .wm{font-weight:800;color:var(--brand);font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative;flex:0 1 260px;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;height:40px;border:0;border-radius:99px;background:var(--field);padding:0 14px 0 36px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.tc{display:flex;height:56px;gap:4px}
.tab{position:relative;display:grid;place-items:center;width:112px;height:56px;background:none;border:0;color:var(--muted);border-bottom:3px solid transparent;padding-top:3px}
.tab:hover::before{content:"";position:absolute;inset:4px 4px 6px;border-radius:8px;background:var(--hover);z-index:-1}
.tab[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .ic{width:26px;height:26px}
.tab .n{position:absolute;top:6px;left:58px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--heart);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tr{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.circ{position:relative;width:40px;height:40px;border-radius:50%;background:#e4e6eb;border:0;display:grid;place-items:center;color:var(--ink)}
.circ:hover{background:#d8dadf}
.circ .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--heart);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.circ.av{padding:0;background:none}

/* ===== Nút ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:0;font-weight:600;font-size:15px;background:#e4e6eb;color:var(--ink);white-space:nowrap}
.btn:hover{background:#d8dadf}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600}
.lnk:hover{text-decoration:underline}
.lnk.mut{color:var(--muted);font-weight:500}

/* ===== Ảnh đại diện ===== */
.av{display:grid;place-items:center;border-radius:50%;font-weight:700;color:#fff;flex:none;width:40px;height:40px;font-size:16px}
.av.s{width:32px;height:32px;font-size:13px}
.av.xs{width:28px;height:28px;font-size:12px}
.av.l{width:36px;height:36px;font-size:15px}

/* ===== Khung 3 cột ===== */
.shell{display:grid;grid-template-columns:280px minmax(0,600px) 300px;justify-content:space-between;gap:24px;max-width:1300px;margin:0 auto;padding:16px 16px 0}
.shell.two{grid-template-columns:280px minmax(0,680px);justify-content:start;gap:32px}
.rail{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;padding-bottom:16px}
.center{min-width:0;padding-bottom:40px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:8px;background:none;text-align:left;font-weight:600;font-size:15px}
.nav-i:hover{background:#e4e6eb}
.nav-i[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav-i .tile{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e4e6eb;color:var(--ink)}
.nav-i[aria-current="page"] .tile{background:var(--brand);color:#fff}
.nav-i .n{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--heart);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.nav-i small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.hr{height:1px;background:#ced0d4;margin:8px 8px}
.rh{font-size:17px;font-weight:700;color:var(--muted);margin:4px 8px 8px}
.foot{color:var(--muted);font-size:13px;line-height:1.6;padding:8px}
.foot button{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.foot button:hover{text-decoration:underline}

/* ===== Thẻ ===== */
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow)}
.gap{display:flex;flex-direction:column;gap:16px}

/* Ô tạo bài */
.creator{padding:12px 16px}
.creator .r1{display:flex;gap:8px;align-items:center}
.creator .fake{flex:1;height:40px;border:0;border-radius:99px;background:var(--field);text-align:left;padding:0 14px;color:var(--muted);font-size:16px}
.creator .fake:hover{background:#e4e6eb}
.creator .r2{display:flex;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.creator .r2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:0;background:none;border-radius:8px;color:var(--muted);font-weight:600}
.creator .r2 button:hover{background:var(--hover)}
.welcome{padding:20px}
.welcome h2{font-size:20px;font-weight:800}
.welcome p{color:var(--muted);margin:6px 0 14px}
.welcome .bts{display:flex;gap:8px;flex-wrap:wrap}

/* Sắp xếp */
.sortbar{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 16px}
.sortbar b{font-size:17px}
.seg{display:flex;gap:2px}
.seg button{height:36px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}

/* Bài viết */
.post{overflow:visible}
.ph{display:flex;gap:10px;align-items:center;padding:12px 16px 0;position:relative}
.ph .who{flex:1;min-width:0;line-height:1.3}
.ph .who b{font-size:15px}
.ph .who .cls{color:var(--muted);font-weight:500}
.ph .who small{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.ph .who small .ic{width:12px;height:12px}
.kebab{width:36px;height:36px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.kebab:hover{background:var(--hover)}
.menu{position:absolute;right:12px;top:52px;z-index:20;background:var(--card);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px;min-width:230px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;font-weight:600;font-size:15px}
.menu button:hover{background:var(--hover)}
.menu button.bad{color:var(--bad)}
.menu .mh{display:flex;gap:10px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh small{display:block;color:var(--muted);font-size:13px}
.pin{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:600}
.pbody{padding:10px 16px 12px;white-space:pre-line;overflow-wrap:anywhere}
.pbody .tt{display:block;font-weight:700;font-size:16px;margin-bottom:2px;white-space:normal}
.pbody.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{padding:0 16px 10px;margin-top:-6px}
.extra{padding:0 16px 12px}
.extra h4{margin:8px 0 4px;font-size:14px}
.extra ol{margin:0;padding-left:20px}
.gal{display:grid;gap:3px;background:var(--card)}
.gal.n2,.gal.n4{grid-template-columns:1fr 1fr}
.gal.n3{grid-template-columns:1fr 1fr}.gal.n3 .gi:first-child{grid-column:span 2;aspect-ratio:2/1}
.gi{display:block;border:0;padding:0;background:var(--field);aspect-ratio:1/1;overflow:hidden}
.gal.n1 .gi{aspect-ratio:auto;max-height:560px}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gal.n1 .gi img{max-height:560px;object-fit:contain;background:#000}
.stat{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:var(--muted);font-size:15px;gap:8px}
.stat .hrt{display:inline-flex;align-items:center;gap:6px}
.stat .hrt i{width:20px;height:20px;border-radius:50%;background:var(--heart);display:grid;place-items:center}
.stat .hrt i svg{width:12px;height:12px;fill:#fff;stroke:none}
.stat .rt{display:flex;gap:12px}
.stat button{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.stat button:hover{text-decoration:underline}
.acts{display:flex;margin:0 16px;border-top:1px solid var(--line);padding:4px 0}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border:0;background:none;border-radius:6px;color:var(--muted);font-weight:600;font-size:15px}
.acts button:hover{background:var(--hover)}
.acts button[aria-pressed="true"]{color:var(--heart)}
.acts button[aria-pressed="true"] .ic{fill:var(--heart);stroke:var(--heart)}
.cms{border-top:1px solid var(--line);margin:0 16px;padding:8px 0 12px}
.cm{display:flex;gap:6px;margin:6px 0}
.cm .bub{background:var(--field);border-radius:18px;padding:8px 12px;max-width:100%;overflow-wrap:anywhere;font-size:15px}
.cm .bub b{display:block;font-size:13px}
.cm .meta{font-size:12px;color:var(--muted);margin:3px 0 0 12px;display:flex;gap:10px}
.cm .meta button{background:none;border:0;padding:0;color:var(--muted);font-weight:700;font-size:12px}
.cform{display:flex;gap:6px;align-items:center;margin-top:8px}
.cform .box{flex:1;display:flex;align-items:center;background:var(--field);border-radius:18px;padding:0 6px 0 12px}
.cform input{flex:1;min-width:0;border:0;background:none;height:36px;font-size:15px;outline:none}
.cform .send{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--brand);display:grid;place-items:center}
.cform .send:hover{background:#e4e6eb}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0 40px}
.status{margin:0 16px 12px;border-radius:8px;padding:10px 12px;font-size:14px}
.status b{display:block}
.st-pending{background:var(--warnbg);color:var(--warn)}
.st-rejected,.st-hidden{background:var(--badbg);color:var(--bad)}
.st-published{background:var(--okbg);color:var(--ok)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-pending{background:var(--warnbg);color:var(--warn)}
.b-rejected,.b-hidden{background:var(--badbg);color:var(--bad)}
.b-published{background:var(--okbg);color:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* Cột phải */
.notice{padding:14px 16px}
.notice .h{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:700;font-size:15px;margin-bottom:6px}
.notice p{font-size:14px;color:var(--ink);white-space:pre-line}
.hot{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:8px;text-align:left}
.hot:hover{background:#e4e6eb}
.hot .th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--brand-soft);flex:none;display:grid;place-items:center;color:var(--brand)}
.hot b{display:block;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot small{color:var(--muted);font-size:13px}

/* ===== Hộp thoại ===== */
.ov{position:fixed;inset:0;z-index:60;background:rgba(244,244,244,.82);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:100%;max-width:500px;background:var(--card);border-radius:10px;box-shadow:var(--shadow-lg);margin:auto}
.modal.wide{max-width:560px}
.mh2{position:relative;padding:16px 56px;border-bottom:1px solid var(--line);text-align:center}
.mh2 h2{font-size:20px;font-weight:700}
.mh2 .x{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.mb{padding:16px}
.mf{padding:0 16px 16px;display:flex;gap:8px;justify-content:flex-end}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp{width:100%;height:44px;border:1px solid #dddfe2;border-radius:6px;padding:0 14px;font-size:16px;background:var(--card)}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 2px var(--brand-soft)}
textarea.inp{height:auto;padding:10px 14px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:4px 0 14px}
.chk input{margin-top:3px;accent-color:var(--brand)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:8px;padding:4px;margin-bottom:16px}
.seg2 button{height:36px;border:0;border-radius:6px;background:none;font-weight:600;color:var(--muted)}
.seg2 button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.small{font-size:13px;color:var(--muted)}
/* Tạo bài */
.cw{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cw b{display:block}
.cw small{display:inline-flex;align-items:center;gap:4px;background:#e4e6eb;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--ink)}
.cw small .ic{width:12px;height:12px}
.ctext{width:100%;min-height:140px;border:0;resize:none;font-size:20px;line-height:1.35;outline:none;padding:4px 0}
.ctext.sm{font-size:16px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.pic{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--field)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:var(--shadow)}
.pic button .ic{width:14px;height:14px}
.addbar{display:flex;align-items:center;justify-content:space-between;border:1px solid #ced0d4;border-radius:8px;padding:8px 8px 8px 16px;margin:12px 0}
.addbar span{font-weight:600}
.addbar label{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--ok);font-weight:600}
.addbar label:hover{background:var(--hover)}
.addbar input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;color:var(--muted);margin-bottom:12px}
.rule{padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{display:block;color:var(--brand)}
.rule span{font-size:14px}
.nl{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.nl button{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border:0;background:none;border-radius:8px;text-align:left}
.nl button:hover{background:var(--hover)}
.nl button .tx{flex:1;font-size:15px}
.nl button .tx small{display:block;color:var(--muted);font-size:13px}
.nl button.un .tx small{color:var(--brand);font-weight:600}
.nl .dot{width:12px;height:12px;border-radius:50%;background:var(--brand);flex:none}
.nl .ni{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}

/* ===== Quản trị ===== */
.adm{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;max-width:1300px;margin:0 auto;padding:16px}
.adm .side{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 8px;position:sticky;top:72px;align-self:start}
.adm .side h1{font-size:22px;font-weight:800;padding:4px 8px 10px}
.adm .main{min-width:0;display:flex;flex-direction:column;gap:16px}
.ah{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ah h2{font-size:22px;font-weight:800}
.ah p{color:var(--muted);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile2{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px}
.tile2 span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.tile2 b{display:block;font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tile2.hl b{color:var(--brand)}
.tw{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:13px}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.uc{display:flex;gap:10px;align-items:center}
.rv{padding:0}
.rv .post{box-shadow:none}
.rvbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.rvbar input{flex:1;min-width:180px;height:36px;border:1px solid #dddfe2;border-radius:6px;padding:0 12px}
.bars{padding:8px 16px 16px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 2fr 50px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tk{height:10px;background:var(--field);border-radius:99px;overflow:hidden}
.bar .tk i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.sec{padding:16px}
.sec h3{font-size:17px;font-weight:700;margin-bottom:8px}

.toast{position:fixed;left:16px;bottom:16px;z-index:90;background:#242526;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow-lg);font-size:15px;max-width:min(420px,calc(100% - 32px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Màn hình nhỏ ===== */
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,600px) 300px;justify-content:center}
  .shell .rail.l{display:none}
  .shell.two{grid-template-columns:minmax(0,680px)}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,600px)}
  .shell .rail{display:none}
  .mob{display:block!important}
  .adm{grid-template-columns:1fr}
  .adm .side{position:static}
  .adm .side .navs{display:flex;overflow:auto;gap:4px}
  .adm .side .navs .nav-i{width:auto;white-space:nowrap}
  .adm .side .navs .nav-i .tile{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab{width:72px}
  .tab .n{left:40px}
}
@media (max-width:640px){
  .top .in{grid-template-columns:auto 1fr auto;padding:0 8px}
  .logo .wm{display:none}
  .tc{justify-content:center}
  .tab{width:56px}
  .tab .n{left:32px}
  .search{flex:0 0 40px}
  .search input{padding:0;width:40px;color:transparent;cursor:pointer}
  .search input:focus{position:fixed;left:8px;right:8px;top:8px;width:auto;padding:0 14px 0 36px;color:var(--ink);z-index:40;box-shadow:var(--shadow-lg)}
  .search input::placeholder{color:transparent}
  .search input:focus::placeholder{color:var(--muted)}
  .shell{padding:8px 0 0}
  .card{border-radius:0}
  .gap{gap:8px}
  .row2{grid-template-columns:1fr}
  td,th{padding:10px 12px}
}
.mob{display:none}

/* ===== Bổ sung v7 ===== */
.rel{position:relative}
.circ.on{background:var(--brand-soft);color:var(--brand)}
.av.xl{width:56px;height:56px;font-size:21px}
.av.xxl{width:132px;height:132px;font-size:48px;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.menu.drop{right:0;top:48px;width:340px;padding:8px}
.mcard{display:flex!important;gap:12px;align-items:center;padding:10px!important;margin-bottom:6px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mcard small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.mi2{width:36px;height:36px;border-radius:50%;background:#e4e6eb;display:grid;place-items:center;flex:none}
.mfoot2{font-size:12px;color:var(--muted);padding:8px 10px 2px}
.npanel{position:absolute;right:0;top:48px;width:360px;max-height:calc(100vh - 72px);overflow:auto;background:var(--card);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px;z-index:25}
.npanel .nh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.npanel .nh h2{font-size:24px;font-weight:800}
.pills{display:flex;gap:6px;padding:6px 8px;flex-wrap:wrap}
.pills button{height:36px;padding:0 12px;border:0;border-radius:99px;background:none;font-weight:600;font-size:15px;color:var(--ink)}
.pills button:hover{background:var(--hover)}
.pills button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.ns{font-weight:700;font-size:17px;padding:10px 8px 4px}
.nav2{position:relative;flex:none}
.nav2 i{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;color:#fff}
.nav2 i .ic{width:13px;height:13px;stroke-width:2.5}
.nl button.un .tx{font-weight:500}
.nl button .tx small{display:block;margin-top:2px}
.tile.c1{background:#e7f0fd;color:#1b74e4}.tile.c2{background:#f7e8ef;color:#83184c}.tile.c3{background:#fdeee6;color:#c2410c}.tile.c4{background:#e6f4ef;color:#0a7c66}
.tile.c5{background:#eceef1;color:#4b4f56}.tile.c6{background:#fde7ee;color:#e0245e}.tile.c7{background:#efe9fb;color:#6d28d9}.tile.c8{background:#e6f5f8;color:#0e7490}
.nav-i[aria-current="page"] .tile{background:var(--brand)!important;color:#fff!important}
.n.gray{background:#e4e6eb!important;color:var(--ink)!important}
.fab{position:fixed;right:24px;bottom:24px;z-index:28;width:52px;height:52px;border-radius:50%;border:0;background:var(--card);color:var(--brand);box-shadow:0 4px 14px rgba(0,0,0,.2);display:grid;place-items:center}
.fab:hover{background:var(--brand);color:#fff}
.fab .ic{width:22px;height:22px}
/* trang cá nhân */
.prof{background:var(--card);box-shadow:var(--shadow)}
.cover{max-width:1100px;margin:0 auto;padding:0 16px}
.cvin{height:300px;border-radius:0 0 10px 10px;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 60px,transparent 61px),radial-gradient(circle at 85% 70%,rgba(255,255,255,.12) 0 90px,transparent 91px),linear-gradient(135deg,#5e0f35 0%,#83184c 45%,#c2417e 100%)}
.phd{max-width:1100px;margin:0 auto;padding:0 40px 16px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.pav{margin-top:-72px;flex:none}
.pav .av.xxl{width:168px;height:168px;font-size:64px;border-width:5px}
.pnm{flex:1;min-width:200px;padding-bottom:8px}
.pnm h1{font-size:32px;font-weight:800;line-height:1.15}
.pnm p{color:var(--muted);font-weight:600;margin-top:4px}
.pbt{display:flex;gap:8px;padding-bottom:12px;flex-wrap:wrap}
.ptabs{max-width:1100px;margin:0 auto;padding:0 40px;border-top:1px solid #ced0d4;display:flex;gap:4px}
.ptabs button{height:56px;padding:0 16px;border:0;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.ptabs button:hover{background:var(--hover)}
.ptabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.pgrid{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.pleft{display:flex;flex-direction:column;gap:16px;position:sticky;top:72px}
.intro{list-style:none;margin:4px 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
.intro li{display:flex;gap:12px;align-items:center}
.intro .ic{color:#8a8d91;width:22px;height:22px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mini div{background:var(--field);border-radius:8px;padding:10px 4px}
.mini b{display:block;font-size:22px;font-weight:800;color:var(--brand)}
.mini span{font-size:12.5px;color:var(--muted)}
.ftabs{display:flex;gap:4px;padding:0 12px 8px;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.ftabs button{height:36px;padding:0 12px;border:0;border-radius:6px;background:none;font-weight:600;color:var(--muted)}
.ftabs button span{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#e4e6eb;color:var(--ink);font-size:12px;margin-left:2px}
.ftabs button:hover{background:var(--hover)}
.ftabs button[aria-pressed="true"]{color:var(--brand);background:var(--brand-soft)}
/* cài đặt */
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border:0;background:none;border-radius:8px;text-align:left}
.sitem:hover{background:var(--hover)}
.sitem>span:nth-child(2){flex:1}
.sitem small{display:block;color:var(--muted);font-size:13px}
.sitem>.ic:last-child{color:var(--muted)}
.mh2 .bk{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.mk.big{width:84px;height:84px;border-radius:50%;background:var(--brand);display:inline-grid;place-items:center}
.mk.big img{width:62px;filter:brightness(0) invert(1)}
/* quản trị v7 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:linear-gradient(120deg,#fff 40%,var(--brand-soft));flex-wrap:wrap}
.hero h2{font-size:24px;font-weight:800}
.hero p{color:var(--muted);margin-top:4px}
.hero p b{color:var(--brand)}
.tile2{display:flex;flex-direction:column;gap:2px}
.tile2 i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.tile2.flat{box-shadow:none;background:transparent;border:1px solid #dadde1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.ch h3{font-size:17px;font-weight:700}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 16px}
.lrow:hover{background:var(--hover)}
.lrow .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);flex:none}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search.wide{flex:0 1 300px;background:var(--card);border-radius:99px;box-shadow:var(--shadow)}
.search.wide input{background:var(--card)}
.adm .ah .pills{padding:0}
@media (max-width:900px){
  .g2{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
  .pleft{position:static}
  .phd{padding:0 16px 12px;justify-content:center;text-align:center}
  .pnm{flex-basis:100%}
  .pbt{justify-content:center;width:100%}
  .ptabs{padding:0 16px}
  .cvin{height:200px}
  .npanel{position:fixed;left:8px;right:8px;top:56px;width:auto}
  .menu.drop{position:fixed;left:8px;right:8px;top:56px;width:auto}
}
@media (max-width:640px){
  .tr .circ[data-act="settings"]{display:none}
  .fab{right:16px;bottom:16px}
}
</style>

function compress(f){return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(1280,im.width),c=document.createElement("canvas");c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){res(b);},"image/jpeg",.8);};im.onerror=function(){res(null);};im.src=fr.result;};
  fr.onerror=function(){res(null);};fr.readAsDataURL(f);
});}

      (u?'<div class="hr"></div><button class="sitem" data-act="logout"><span class="mi2">'+ic("out")+'</span><span><b>Đăng xuất</b></span></button>':'<div class="hr"></div><div style="display:flex;gap:8px;padding:8px"><button class="btn pri" style="flex:1" data-act="login" data-v="up">Đăng ký</button><button class="btn" style="flex:1" data-act="login" data-v="in">Đăng nhập</button></div>')+'</div>';
  }
  modal(h);
}

/* ---------- sự kiện ---------- */
function needLogin(){if(me())return false;authModal("in");return true;}
function after(msg){return refresh().then(function(){render();if(msg)toast(msg);});}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(ui.menu&&!e.target.closest("[data-menu]")&&!(b&&b.getAttribute("data-act")==="menu")){ui.menu=null;if(!b){render();return;}}
  if(!b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),v=b.getAttribute("data-v"),u=me();
  if(act==="ov"){if(e.target===b)closeModal();return;}
  if(act==="menu"){ui.menu=ui.menu===v?null:v;render();if(v==="notif"&&ui.menu)window.scrollTo(window.pageXOffset,window.pageYOffset);return;}
  if(act!=="logout"&&act!=="std"&&b.closest(".menu"))ui.menu=null;
  if(act==="nav"){if(b.closest("#modal"))closeModal();go(v);return;}
  if(act==="open"){openPost(id);return;}
  if(act==="more"){ui.open[id]=1;render();return;}
  if(act==="focuscm"){if(needLogin())return;var ci=document.getElementById("c-"+id);if(ci)ci.focus();else openPost(id);return;}
  if(act==="login"){e.preventDefault();ui.menu=null;render();authModal(v);return;}
  if(act==="authtab"){authModal(v);return;}
  if(act==="std"){e.preventDefault();ui.menu=null;renderHeader();stdModal();return;}
  if(act==="close"){closeModal();return;}
  if(act==="sort"){ui.sort=v;render();return;}
  if(act==="compose"){if(needLogin())return;if(u.locked){toast("Tài khoản của bạn đang bị khóa quyền đăng.");return;}composeModal(null,v==="photo");return;}
  if(act==="edit"){render();composeModal(id);return;}
  if(act==="rmkeep"){ui.draft.keep.splice(+v,1);drawCompose();return;}
  if(act==="rmfile"){ui.draft.files.splice(+v,1);drawCompose();return;}
  if(act==="tab"){ui.tab=v;render();window.scrollTo(0,0);return;}
  if(act==="notifs"){ui.menu="notif";render();return;}
  if(act==="nf"){ui.nf=v;render();return;}
  if(act==="pf"){ui.pf=v;render();return;}
  if(act==="mf"){ui.mf=v;render();return;}
  if(act==="sortgo"){ui.sort=v;ui.q="";go("feed");return;}
  if(act==="settings"){ui.menu=null;render();settingsModal(v||"home");return;}
  if(act==="setgo"){settingsModal(v);return;}
  if(act==="dopost"){submitPost();return;}
  if(act==="progress"){render();modal(mhead("Thêm cập nhật")+'<div class="mb"><input type="hidden" id="gid" value="'+id+'"><label class="fld"><span>Bạn đã làm thêm gì?</span><textarea id="gn" class="inp" rows="3" maxlength="500" placeholder="Ví dụ: Đã dùng một tuần, keo vẫn chắc."></textarea></label></div><div class="mf"><button class="btn" data-act="close">Hủy</button><button class="btn pri" data-act="doprogress">Lưu</button></div>');return;}
  run(async function(){
    if(act==="logout"){ui.menu=null;closeModal();await sb.auth.signOut();sess=null;if(ui.view==="mine"||ui.view==="admin")ui.view="feed";await after("Đã đăng xuất.");return;}
    if(act==="dologin"){
      var r=await sb.auth.signInWithPassword({email:val("le").toLowerCase(),password:document.getElementById("lp").value});
      if(r.error){toast(/confirm/i.test(r.error.message)?"Email chưa được xác nhận.":"Email hoặc mật khẩu chưa đúng.");return;}
      closeModal();await refresh();if(isT()&&pending().length){ui.view="admin";ui.tab="queue";}render();toast("Chào "+me().name+"!");return;
    }
    if(act==="doreg"){
      var rn=val("rn"),re=val("le").toLowerCase(),rp=document.getElementById("lp").value;
      if(rn.length<2){toast("Hãy nhập tên hiển thị (ít nhất 2 ký tự).");return;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(re)){toast("Email chưa đúng định dạng.");return;}
      if(rp.length<6){toast("Mật khẩu cần ít nhất 6 ký tự.");return;}
      if(!document.getElementById("ra").checked){toast("Hãy đồng ý Tiêu chuẩn cộng đồng để tiếp tục.");return;}
      var bn=await sb.rpc("check_name",{n:rn});if(bn.data){toast(bn.data);return;}
      var g=await sb.auth.signUp({email:re,password:rp,options:{data:{name:rn,cls:val("rl")}}});
      if(g.error){toast(/already|registered/i.test(g.error.message)?"Email này đã có tài khoản. Hãy đăng nhập.":"Chưa đăng ký được: "+g.error.message);return;}
      if(!g.data.session){closeModal();toast("Đã đăng ký. Hãy mở email để xác nhận rồi đăng nhập.");return;}
      closeModal();await after("Chào "+rn+"! Tài khoản đã sẵn sàng.");return;
    }
    if(act==="like"){
      if(needLogin())return;
      var lp=post(id),ix=lp.likes.indexOf(u.id),y=window.pageYOffset;
      if(ix>-1)lp.likes.splice(ix,1);else lp.likes.push(u.id);render();window.scrollTo(0,y);
      var res=ix>-1?await sb.from("likes").delete().eq("post_id",id).eq("user_id",u.id):await sb.from("likes").insert({post_id:id,user_id:u.id});
      if(res.error){await refresh();render();window.scrollTo(0,y);throw res.error;}return;
    }
    if(act==="comment"){
      if(needLogin())return;
      var inp=document.getElementById("c-"+id),tx=inp.value.trim();if(!tx)return;
      var cr=await sb.from("comments").insert({post_id:id,user_id:u.id,body:tx});if(cr.error)throw cr.error;
      var y2=window.pageYOffset;await refresh();render();window.scrollTo(0,y2);return;
    }
    if(act==="doprogress"){
      var gn=val("gn");if(!gn)return;
      var pu=await sb.from("post_updates").insert({post_id:val("gid"),user_id:u.id,note:gn});if(pu.error)throw pu.error;
      closeModal();await after("Đã thêm cập nhật.");return;
    }
    if(act==="nopen"){
      var nn=db.notifs.filter(function(n){return n.id===id;})[0];
      if(nn){nn.read=true;await sb.from("notifications").update({read:true}).eq("id",id);}
      ui.menu=null;closeModal();if(nn&&post(nn.pid))openPost(nn.pid);else render();return;
    }
    if(act==="nreadall"){db.notifs.forEach(function(n){n.read=true;});await sb.from("notifications").update({read:true}).eq("to_user",u.id).eq("read",false);render();return;}
    if(act==="saveacc"){
      var r1=await sb.rpc("update_my_profile",{n:val("an"),c:val("ac")});if(r1.error)throw r1.error;if(r1.data){toast(r1.data);return;}
      await refresh();render();settingsModal("acc");toast("Đã lưu thông tin.");return;
    }
    if(act==="savepw"){
      var p1=document.getElementById("np1").value,p2=document.getElementById("np2").value;
      if(p1.length<6){toast("Mật khẩu mới cần ít nhất 6 ký tự.");return;}
      if(p1!==p2){toast("Hai mật khẩu chưa giống nhau.");return;}
      var pw=await sb.auth.updateUser({password:p1});if(pw.error){toast("Chưa đổi được mật khẩu: "+pw.error.message);return;}
      settingsModal("home");toast("Đã đổi mật khẩu.");return;
    }
    if(!isT())return;
    if(act==="approve"){var a=await sb.from("posts").update({status:"published",teacher_note:null}).eq("id",id);if(a.error)throw a.error;await after("Đã duyệt và đăng bài.");return;}
    if(act==="reject"){var note=val("rr-"+id);if(!note){toast("Hãy ghi góp ý để học sinh biết cần sửa gì.");var ri=document.getElementById("rr-"+id);if(ri)ri.focus();return;}
      var rj=await sb.from("posts").update({status:"rejected",teacher_note:note}).eq("id",id);if(rj.error)throw rj.error;await after("Đã trả lại bài kèm góp ý.");return;}
    if(act==="pin"){var pp=post(id),pn=await sb.from("posts").update({pinned:!pp.pinned}).eq("id",id);if(pn.error)throw pn.error;await after(pp.pinned?"Đã bỏ ghim.":"Đã ghim bài.");return;}
    if(act==="hide"){var hd=await sb.from("posts").update({status:"hidden"}).eq("id",id);if(hd.error)throw hd.error;await after("Đã ẩn bài khỏi bảng tin.");return;}
    if(act==="hidecm"){var hc=await sb.from("comments").update({hidden:true}).eq("id",id);if(hc.error)throw hc.error;await after("Đã ẩn bình luận.");return;}
    if(act==="delpost"){if(!confirm("Xóa hẳn bài này? Không khôi phục được."))return;var dp=await sb.from("posts").delete().eq("id",id);if(dp.error)throw dp.error;if(ui.view==="post")ui.view="feed";await after("Đã xóa bài.");return;}
    if(act==="lock"){var lu=user(id),lk=await sb.from("profiles").update({locked:!lu.locked}).eq("id",id);if(lk.error)throw lk.error;await after(lu.locked?"Đã mở quyền đăng.":"Đã khóa quyền đăng.");return;}
    if(act==="savenotice"){var sn=await sb.from("settings").update({notice:val("nt")}).eq("id",1);if(sn.error)throw sn.error;await after("Đã lưu thông báo.");return;}
  });
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;
    if(ui.view!=="feed"){ui.view="feed";render();var qq=document.getElementById("q");qq.focus();qq.setSelectionRange(qq.value.length,qq.value.length);}
    else{var l=document.getElementById("list");if(l)l.innerHTML=feedList();}}
  if(e.target.id==="ct"&&ui.draft){ui.draft.text=e.target.value;var pb=document.querySelector("[data-act=dopost]");if(pb)pb.disabled=e.target.value.trim().length<10;}
  if(e.target.id==="uq"){ui.uq=e.target.value;render();var uqi=document.getElementById("uq");uqi.focus();uqi.setSelectionRange(uqi.value.length,uqi.value.length);}
});
document.addEventListener("change",function(e){
  if(e.target.id==="pf"&&ui.draft){
    var d=ui.draft,room=4-d.keep.length-d.files.length;
    Array.prototype.slice.call(e.target.files,0,Math.max(0,room)).forEach(function(f){if(/^image\//.test(f.type))d.files.push({f:f,url:URL.createObjectURL(f)});});
    if(e.target.files.length>room)toast("Mỗi bài tối đa 4 ảnh.");
    drawCompose();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(ui.menu){ui.menu=null;render();}else closeModal();}
  if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("c-")===0){e.preventDefault();var b=document.querySelector('[data-act=comment][data-id="'+e.target.id.slice(2)+'"]');if(b)b.click();}
  if(e.key==="Enter"&&/^(le|lp|rn|rl)$/.test(e.target.id||"")){var d=document.querySelector("[data-act=dologin],[data-act=doreg]");if(d)d.click();}
  if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("rr-")===0){var r=document.querySelector('[data-act=reject][data-id="'+e.target.id.slice(3)+'"]');if(r)r.click();}
});
function fromHash(){
  var h=location.hash.slice(1);
  if(h.indexOf("bai-")===0&&h!=="bai-cua-toi"){var id=h.slice(4);if(post(id)&&!(ui.view==="post"&&ui.pid===id)){openPost(id);return true;}}
  var m={"bang-tin":"feed","bai-cua-toi":"mine","quan-tri":"admin"}[h];if(m&&m!==ui.view){ui.view=m;render();return true;}
  return false;
}
window.addEventListener("hashchange",fromHash);
function boot(){
  if(!window.supabase){document.getElementById("app").innerHTML='<div class="shell two"><div></div><div class="card empty"><b>Không tải được trang</b>Hãy kiểm tra mạng và tải lại.</div></div>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  render();
  (async function(){
    try{
      if(!ss("esh-visit")){ss("esh-visit","1");await sb.rpc("increment_visit");}
      await refresh();db.ready=true;
      if(!fromHash())render();
      if(anon)toast("Cách vào bằng tên đã ngừng. Hãy đăng ký tài khoản bằng email.");
    }catch(e){document.getElementById("app").innerHTML='<div class="shell two"><div></div><div class="card empty"><b>Không tải được dữ liệu</b>Hãy tải lại trang sau ít phút.</div></div>';}
  })();
  setInterval(function(){
    var a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if(!db.ready||busy||typing||ui.menu||document.getElementById("modal").innerHTML||document.hidden)return;
    refresh().then(render).catch(function(){});
  },60000);
}
boot();
})();
</script>
